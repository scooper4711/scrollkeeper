sonar.projectKey=scooper4711_scrollkeeper
sonar.organization=scooper4711

sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8

# Written by scripts/coverage.sh from the test run's coverage data.
sonar.coverageReportPaths=coverage/sonar-coverage.xml

# SwiftUI view declarations and the entry point are not unit tested; all logic lives in
# ScrollkeeperKit, which is what the coverage gate measures (see docs/specs).
sonar.coverage.exclusions=Sources/ScrollkeeperUI/**,Sources/Scrollkeeper/**

# swift:S1075 asks for every URL and path to come from configuration. This app talks to fixed
# Paizo addresses, and its tests use fixed example addresses; they are the subject of the code,
# not settings.
sonar.issue.ignore.multicriteria=hardcodedAddresses
sonar.issue.ignore.multicriteria.hardcodedAddresses.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.hardcodedAddresses.resourceKey=**/*.swift
