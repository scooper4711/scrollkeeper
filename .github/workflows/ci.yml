name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and coverage
    # The Mac mini runs our own builds; pull requests from forks stay on GitHub's machines, since this is a public
    # repository and a self-hosted runner would run a stranger's code on the mini.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || 'mac-mini' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/version.sh counts every commit for the build number.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --quiet

      - name: Test with coverage gate
        run: scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/sonar-coverage.xml

      - name: Build the app bundle
        run: scripts/build-app.sh

      - name: Build the iPad app
        run: |
          xcodebuild -project ios/Scrollkeeper.xcodeproj -scheme Scrollkeeper-iPad \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO build | tail -n 3

      - name: Run the iPad UI tests
        run: scripts/run-ipad-uitests.sh

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    # Pull requests from forks have no access to the token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
