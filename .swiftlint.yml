included:
  - Sources
  - Tests
  - ios/App
  - ios/UITests
  - Package.swift
line_length:
  warning: 120
  error: 120
file_length:
  warning: 300
  error: 500
function_body_length:
  warning: 30
  error: 50
type_body_length:
  warning: 250
  error: 400
cyclomatic_complexity:
  warning: 10
  error: 15
function_parameter_count:
  warning: 4
  error: 5
identifier_name:
  min_length: 2
opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - toggle_bool
